<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Education - MCQ Exam Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Bright Education</h1>
            <p>MCQ Exam Portal</p>
        </div>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('start_exam') }}" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Rahul Sharma" required autofocus>
            </div>
            <div class="form-group">
                <label for="roll_no">Roll Number / Class</label>
                <input type="text" id="roll_no" name="roll_no" placeholder="e.g. 10-A / Roll 15" required>
            </div>
            <button type="submit" class="btn btn-gold btn-full">Start Exam →</button>
        </form>
    </div>
</body>
</html>
